# ============================================================
# NEUROFORGE ENTERPRISE SDLC PLATFORM - CONFIGURATION
# ============================================================

# Application Info
spring.application.name=neuroforge-backend
server.port=8080

# Import local overrides (gitignored) if present
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

# ============================================================
# MySQL Database Connection (Environment-Variable Driven)
# ============================================================
# You can override these via system environment variables or edit your password in application-local.properties
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:neuroforge_enterprise_sdlc}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ============================================================
# Spring Data JPA / Hibernate Configuration
# ============================================================
# 'validate' verifies that existing database tables match JPA entity definitions without altering/dropping tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# JWT Security Configuration (Module 1)
# ============================================================
neuroforge.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
neuroforge.jwt.expiration-ms=86400000

# ============================================================
# Logging Configuration
# ============================================================
logging.level.com.neuroforge=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# ============================================================
# AI Engine Configuration (Module 5 & 7)
# ============================================================
neuroforge.ai.gemini.api-key=${GEMINI_API_KEY:}
neuroforge.ai.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
neuroforge.ai.timeout-ms=15000
